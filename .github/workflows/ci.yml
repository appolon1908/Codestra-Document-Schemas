name: ci

on:
  push:
    branches: ["development", "testing", "staging", "production", "mission/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Python validators
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Install Node validators
        run: npm ci
      - name: Validate generated contracts and packages
        run: PYTHON=python bash scripts/validate.sh
